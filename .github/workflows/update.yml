name: Update films
on:
  schedule:
    - cron: "0 6 * * *"  # 06:00 UTC = 6am UK in winter, 7am in summer
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 update.py --selftest
      - run: python3 update.py
        env:
          TMDB_KEY: ${{ secrets.TMDB_KEY }}
          OMDB_KEY: ${{ secrets.OMDB_KEY }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add films.json
          git diff --cached --quiet || (git commit -m "Update films" && git push)
